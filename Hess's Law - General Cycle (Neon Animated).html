<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hess's Law — General Cycle (Animated)</title>
<style>
  html,body{margin:0;padding:0;background:#000000;height:100%;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;padding:40px 16px;}
  .wrap{max-width:900px;width:100%;}
  svg{width:100%;height:auto;display:block;}
  .controls{display:flex;justify-content:center;gap:14px;margin-top:22px;}
  button{background:#050505;color:#FF2EC4;border:1.5px solid #FF2EC4;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.03em;box-shadow:0 0 10px rgba(255,46,196,0.45);transition:all .15s ease;}
  button:hover{background:rgba(255,46,196,0.12);box-shadow:0 0 18px rgba(255,46,196,0.8);}
  button:disabled{opacity:.4;cursor:default;box-shadow:none;}
  .caption{color:#ff9fe4;text-align:center;font-size:13px;margin-top:10px;opacity:.9;letter-spacing:.02em;}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <filter id="glow2" filterUnits="userSpaceOnUse" x="-40" y="-40" width="760" height="510">
    <feGaussianBlur stdDeviation="3.2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow2Soft" filterUnits="userSpaceOnUse" x="-40" y="-40" width="760" height="510">
    <feGaussianBlur stdDeviation="1.6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<text x="90" y="72" font-size="26" font-weight="bold" fill="#EAF6FF" filter="url(#glow2Soft)">A</text>
<text x="90" y="92" font-size="13" fill="#8fdcff" filter="url(#glow2Soft)">Initial reactants</text>
<text x="565" y="72" font-size="26" font-weight="bold" fill="#EAF6FF" filter="url(#glow2Soft)">B</text>
<text x="565" y="92" font-size="13" fill="#8fdcff" filter="url(#glow2Soft)">Final products</text>

<line id="h1" pathLength="1" x1="140" y1="68" x2="535" y2="68" stroke="#FF2EC4" stroke-width="2.75" marker-end="url(#arrow2)" filter="url(#glow2)"/>
<text x="337" y="54" text-anchor="middle" font-size="13" fill="#FF2EC4" filter="url(#glow2)">direct route: &#916;H1</text>

<g id="step1" class="stepgroup">
<text x="320" y="250" font-size="26" font-weight="bold" fill="#EAF6FF" filter="url(#glow2Soft)">C</text>
<text x="320" y="270" font-size="13" fill="#8fdcff" filter="url(#glow2Soft)">Intermediates</text>
<line id="h2" pathLength="1" x1="120" y1="98" x2="300" y2="238" stroke="#00F0FF" stroke-width="2.25" marker-end="url(#arrow2)" filter="url(#glow2)"/>
<text x="190" y="180" text-anchor="middle" font-size="13" fill="#00F0FF" filter="url(#glow2)">&#916;H2</text>
</g>
<g id="step2" class="stepgroup">
<line id="h3" pathLength="1" x1="365" y1="238" x2="545" y2="98" stroke="#00F0FF" stroke-width="2.25" marker-end="url(#arrow2)" filter="url(#glow2)"/>
<text x="470" y="180" text-anchor="middle" font-size="13" fill="#00F0FF" filter="url(#glow2)">&#916;H3</text>
</g>
<g id="step3" class="stepgroup">
<text x="90" y="378" font-size="26" font-weight="bold" fill="#EAF6FF" filter="url(#glow2Soft)">D</text>
<text x="90" y="398" font-size="13" fill="#8fdcff" filter="url(#glow2Soft)">Intermediates</text>
<line id="h4" pathLength="1" x1="88" y1="98" x2="103" y2="358" stroke="#00F0FF" stroke-width="2.25" marker-end="url(#arrow2)" filter="url(#glow2)"/>
<text x="60" y="230" text-anchor="middle" font-size="13" fill="#00F0FF" filter="url(#glow2)">&#916;H4</text>
</g>
<g id="step4" class="stepgroup">
<text x="465" y="378" font-size="26" font-weight="bold" fill="#EAF6FF" filter="url(#glow2Soft)">E</text>
<text x="465" y="398" font-size="13" fill="#8fdcff" filter="url(#glow2Soft)">Intermediates</text>
<line id="h5" pathLength="1" x1="150" y1="370" x2="450" y2="370" stroke="#00F0FF" stroke-width="2.25" marker-end="url(#arrow2)" filter="url(#glow2)"/>
<text x="300" y="358" text-anchor="middle" font-size="13" fill="#00F0FF" filter="url(#glow2)">&#916;H5</text>
</g>
<g id="step5" class="stepgroup">
<line id="h6" pathLength="1" x1="503" y1="358" x2="562" y2="98" stroke="#00F0FF" stroke-width="2.25" marker-end="url(#arrow2)" filter="url(#glow2)"/>
<text x="580" y="230" text-anchor="middle" font-size="13" fill="#00F0FF" filter="url(#glow2)">&#916;H6</text>
</g>
<g id="step6" class="stepgroup">
<text x="340" y="424" text-anchor="middle" font-size="15" fill="#39FFB0" filter="url(#glow2)">Every route gives the same overall &#916;H</text>
</g>
</svg>
<div class="controls">
<button id="playBtn2" onclick="playAnim2()">Play animation</button>
</div>
<div class="caption">Hess's law — general cycle. Click play to reveal the alternative pathways via C, then via D and E.</div>
</div>
<script>
const steps2=["step1","step2","step3","step4","step5","step6"];
document.querySelectorAll(".stepgroup").forEach(g=>g.style.opacity="0");
document.querySelectorAll("#h2,#h3,#h4,#h5,#h6").forEach(l=>{l.style.strokeDasharray="1";l.style.strokeDashoffset="1";});
function sleep2(ms){return new Promise(r=>setTimeout(r,ms));}
async function playAnim2(){
  const btn=document.getElementById("playBtn2");
  btn.disabled=true;
  steps2.forEach(id=>{const g=document.getElementById(id);g.style.transition="none";g.style.opacity="0";});
  document.querySelectorAll("#h2,#h3,#h4,#h5,#h6").forEach(l=>{l.style.transition="none";l.style.strokeDashoffset="1";});
  await sleep2(50);
  for(const id of steps2){
    const g=document.getElementById(id);
    g.style.transition="opacity .5s ease";
    g.style.opacity="1";
    const lines=g.querySelectorAll("line");
    lines.forEach(l=>{l.style.transition="stroke-dashoffset .7s ease";l.style.strokeDashoffset="0";});
    await sleep2(id==="step6"?600:850);
  }
  btn.disabled=false;
  btn.textContent="Replay animation";
}
</script>
</body>
</html>
