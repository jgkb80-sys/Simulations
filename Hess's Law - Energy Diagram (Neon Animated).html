<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hess's Law — Energy Cycle (Animated)</title>
<style>
  html,body{margin:0;padding:0;background:#000000;height:100%;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;padding:40px 16px;}
  .wrap{max-width:900px;width:100%;}
  svg{width:100%;height:auto;display:block;}
  .controls{display:flex;justify-content:center;gap:14px;margin-top:22px;}
  button{background:#050505;color:#00F0FF;border:1.5px solid #00F0FF;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.03em;box-shadow:0 0 10px rgba(0,240,255,0.45);transition:all .15s ease;}
  button:hover{background:rgba(0,240,255,0.12);box-shadow:0 0 18px rgba(0,240,255,0.8);}
  button:disabled{opacity:.4;cursor:default;box-shadow:none;}
  .caption{color:#8fd4e8;text-align:center;font-size:13px;margin-top:10px;opacity:.9;letter-spacing:.02em;}
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-40" y="-40" width="760" height="500">
    <feGaussianBlur stdDeviation="3.2" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowSoft" filterUnits="userSpaceOnUse" x="-40" y="-40" width="760" height="500">
    <feGaussianBlur stdDeviation="1.6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<line x1="60" y1="50" x2="60" y2="360" stroke="#4d7a8c" stroke-width="1.5"/>
<line x1="60" y1="360" x2="630" y2="360" stroke="#4d7a8c" stroke-width="1.5"/>
<text x="28" y="150" text-anchor="middle" font-size="12" fill="#8fd4e8">Potential</text>
<text x="28" y="166" text-anchor="middle" font-size="12" fill="#8fd4e8">energy</text>
<text x="345" y="385" text-anchor="middle" font-size="12" fill="#8fd4e8">Reaction coordinate</text>

<line x1="90" y1="70" x2="280" y2="70" stroke="#EAF6FF" stroke-width="3" filter="url(#glowSoft)"/>
<text x="90" y="58" font-size="15" fill="#EAF6FF" filter="url(#glowSoft)">Reactants</text>

<line x1="380" y1="220" x2="560" y2="220" stroke="#EAF6FF" stroke-width="3" filter="url(#glowSoft)"/>
<text x="380" y="208" font-size="15" fill="#EAF6FF" filter="url(#glowSoft)">Products</text>

<line x1="280" y1="70" x2="620" y2="70" stroke="#5f8fa3" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="560" y1="220" x2="620" y2="220" stroke="#5f8fa3" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="620" y1="72" x2="620" y2="218" stroke="#FF2EC4" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)" filter="url(#glow)"/>
<text x="605" y="141" text-anchor="end" font-size="13" fill="#FF2EC4" filter="url(#glow)">Direct route</text>
<text x="605" y="158" text-anchor="end" font-size="13" fill="#FF2EC4" filter="url(#glow)">&#916;Hr = &#8722;100 kJ/mol</text>

<g id="step1" class="stepgroup">
<line class="drawline" id="line1" pathLength="1" x1="90" y1="145" x2="280" y2="145" stroke="#EAF6FF" stroke-width="3" filter="url(#glowSoft)"/>
<text font-size="15" x="90" y="133" fill="#EAF6FF" filter="url(#glowSoft)">Intermediate (1)</text>
<line class="drawline" id="arrow1" pathLength="1" x1="255" y1="72" x2="255" y2="141" stroke="#00F0FF" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#glow)"/>
<text font-size="13" x="245" y="112" text-anchor="end" fill="#00F0FF" filter="url(#glow)">&#916;H1 = &#8722;50 kJ/mol</text>
</g>
<g id="step2" class="stepgroup">
<line class="drawline" id="line2" pathLength="1" x1="90" y1="295" x2="340" y2="295" stroke="#EAF6FF" stroke-width="3" filter="url(#glowSoft)"/>
<text font-size="15" x="90" y="283" fill="#EAF6FF" filter="url(#glowSoft)">Intermediate (2)</text>
<line class="drawline" id="arrow2" pathLength="1" x1="255" y1="147" x2="255" y2="291" stroke="#00F0FF" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#glow)"/>
<text font-size="13" x="245" y="222" text-anchor="end" fill="#00F0FF" filter="url(#glow)">&#916;H2 = &#8722;100 kJ/mol</text>
</g>
<g id="step3" class="stepgroup">
<line class="drawline" id="arrow3" pathLength="1" x1="340" y1="295" x2="380" y2="222" stroke="#FFB000" stroke-width="2.5" marker-end="url(#arrow)" filter="url(#glow)"/>
<text font-size="13" x="385" y="260" text-anchor="start" fill="#FFB000" filter="url(#glow)">&#916;H3 = +50 kJ/mol</text>
</g>
<g id="step4" class="stepgroup">
<text font-size="15" x="345" y="405" text-anchor="middle" fill="#39FFB0" filter="url(#glow)">Same overall &#916;H by either route</text>
</g>
</svg>
<div class="controls">
<button id="playBtn" onclick="playAnim()">Play animation</button>
</div>
<div class="caption">Hess's law — enthalpy cycle. Click play to reveal the two-step pathway alongside the direct route.</div>
</div>
<script>
const steps=["step1","step2","step3","step4"];
document.querySelectorAll(".stepgroup").forEach(g=>g.style.opacity="0");
document.querySelectorAll(".drawline").forEach(l=>{l.style.strokeDasharray="1";l.style.strokeDashoffset="1";});
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
async function playAnim(){
  const btn=document.getElementById("playBtn");
  btn.disabled=true;
  steps.forEach(id=>{const g=document.getElementById(id);g.style.transition="none";g.style.opacity="0";});
  document.querySelectorAll(".drawline").forEach(l=>{l.style.transition="none";l.style.strokeDashoffset="1";});
  await sleep(50);
  for(const id of steps){
    const g=document.getElementById(id);
    g.style.transition="opacity .5s ease";
    g.style.opacity="1";
    const lines=g.querySelectorAll(".drawline");
    lines.forEach(l=>{l.style.transition="stroke-dashoffset .8s ease";l.style.strokeDashoffset="0";});
    await sleep(id==="step4"?600:1100);
  }
  btn.disabled=false;
  btn.textContent="Replay animation";
}
</script>
</body>
</html>
